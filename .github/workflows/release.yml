name: Release
# Push a v* tag to publish. Manual runs (workflow_dispatch) only build artifacts, no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          case "${{ matrix.target }}" in x86_64-apple-darwin) exit 0;; esac
          ./target/${{ matrix.target }}/release/icloud version
      - name: Package
        shell: bash
        run: |
          name=icloud-cli-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/icloud.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            asset="$name.zip"
          else
            cp target/${{ matrix.target }}/release/icloud "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: icloud-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: |
          cp install.sh dist/icloud-cli-installer.sh
          cp install.ps1 dist/icloud-cli-installer.ps1
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
